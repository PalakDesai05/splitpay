spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/splitpay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
